[project]
name = "lazy107"
version = "0.1.0"
description = "Cluster-side Slurm job submission CLI for USTC 107"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional: used by notebook -> .py conversion; without it the built-in
# JSON fallback kicks in (extracting code cells directly).
notebook = ["nbconvert"]

[project.scripts]
lazy107 = "lazy107.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazy107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
